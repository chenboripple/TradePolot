[project]
name = "ripple_tradePilot"
version = "0.5.0"
description = "Wave trading system with shared strategy core"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Ripple" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "tushare>=1.2",
  "akshare>=1.10",
  "pyyaml>=6.0",
  "httpx>=0.24",
  "click>=8.0",
  # ML 信号质量模型（D 阶段，懒加载）：训练/校准用工，import 全部惰性化，
  # 未安装时 dashboard/monitor 的信号链路照常运行（仅 ml train/promote 报清晰错误）。
  "scikit-learn>=1.4,<1.7",
  "joblib>=1.3",
]

[project.scripts]
tradepilot = "ripple_tradePilot.cli:cli"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ripple_tradePilot.api" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
